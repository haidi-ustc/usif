name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # CI quality command guardrails for tests: black --check | isort --check-only | mypy usif | bandit -q -r usif | pip_audit | python scripts/check_release_metadata.py | pytest tests/unit | pytest tests/integration tests/reliability tests/examples | python -m build | dist/*.whl
  lint-type-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dev dependencies
        run: python -m pip install -e ".[dev,pymatgen,ase]" -r scripts/materials_project/requirements.txt
      - name: Formatting
        run: |
          black --check usif tests examples scripts
          isort --check-only usif tests examples scripts
      - name: Type check
        run: mypy usif
      - name: Security scan
        run: |
          bandit -q -r usif -x tests
          pip_audit
      - name: Release metadata guard
        run: python scripts/check_release_metadata.py

  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install runtime and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Unit tests
        run: pytest tests/unit --cov=usif --cov-report=xml --cov-report=term-missing

  integration:
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install integration dependencies
        run: python -m pip install -e ".[dev,pymatgen,ase]" -r scripts/materials_project/requirements.txt
      - name: Integration and reliability tests
        run: pytest tests/integration tests/reliability tests/examples

  build-smoke:
    runs-on: ubuntu-latest
    needs: [lint-type-security, integration]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build tool
        run: python -m pip install build
      - name: Build sdist and wheel
        run: python -m build
      - name: Install wheel in clean environment
        run: |
          python -m venv /tmp/usif-wheel-smoke
          /tmp/usif-wheel-smoke/bin/python -m pip install dist/*.whl
          /tmp/usif-wheel-smoke/bin/usif version
          usif --version
          python - <<'PY'
          import usif
          assert usif.__version__ == "0.10.0"
          assert usif.RELEASE_RECORD == "20261116.019"
          from usif import Cell, Dataset, Structure, decode, encode
          s = Structure.from_fractional(["Na", "Cl"], [[0, 0, 0], [0.5, 0.5, 0.5]], Cell.cubic(5.64))
          assert decode(encode(s)) == s
          print("USIF wheel smoke OK", usif.__version__)
          PY
