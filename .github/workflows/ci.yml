name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # CI quality command guardrails for tests: black --check | isort --check-only | mypy usif | bandit -q -r usif | pip-audit | python scripts/check_release_metadata.py | pytest tests/unit | pytest tests (coverage gate) | python -m build | dist/*.whl
  #
  # Coverage gate: `fail_under = 80` in pyproject.toml applies to the whole suite, which runs in
  # the `integration` job (unit + integration + reliability + examples, all optional backends
  # installed). The unit layer alone cannot reach it: modules such as usif/io.py, usif/upgrade and
  # the backends are exercised only by the integration and reliability layers. The `unit` matrix
  # therefore reports coverage per Python version without the gate (--cov-fail-under=0).
  lint-type-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dev dependencies
        run: python -m pip install -e ".[dev,pymatgen,ase]" -r scripts/materials_project/requirements.txt
      - name: Formatting
        run: |
          black --check usif tests examples scripts
          isort --check-only usif tests examples scripts
      - name: Type check
        run: mypy usif
      - name: Security scan
        run: |
          bandit -q -r usif -x tests
          pip-audit
      - name: Release metadata guard
        run: python scripts/check_release_metadata.py

  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install runtime and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Unit tests (coverage reported, gated in `integration`)
        run: pytest tests/unit --cov=usif --cov-report=term --cov-fail-under=0

  integration:
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install integration dependencies
        run: python -m pip install -e ".[dev,pymatgen,ase]" -r scripts/materials_project/requirements.txt
      - name: Full suite with the coverage gate (fail_under = 80)
        run: pytest tests --cov=usif --cov-report=xml --cov-report=term-missing

  build-smoke:
    runs-on: ubuntu-latest
    needs: [lint-type-security, integration]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build tool
        run: python -m pip install build
      - name: Build sdist and wheel
        run: python -m build
      - name: Install wheel in clean environment
        run: |
          python -m venv /tmp/usif-wheel-smoke
          /tmp/usif-wheel-smoke/bin/python -m pip install dist/*.whl
          /tmp/usif-wheel-smoke/bin/usif version
          /tmp/usif-wheel-smoke/bin/usif --version
          cd /tmp  # import the installed wheel, not the checkout
          /tmp/usif-wheel-smoke/bin/python - <<'PY'
          import usif
          assert usif.__version__ == "0.12.0"
          assert usif.RELEASE_RECORD == "20261126.021"
          from usif import Cell, Dataset, Structure, decode, encode
          s = Structure.from_fractional(["Na", "Cl"], [[0, 0, 0], [0.5, 0.5, 0.5]], Cell.cubic(5.64))
          assert decode(encode(s)) == s
          print("USIF wheel smoke OK", usif.__version__)
          PY
