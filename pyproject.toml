[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "usif"
dynamic = ["version"]
description = "Universal Structure Interchange Format for crystals and molecules"
readme = "README.md"
requires-python = ">=3.10"
license = "LicenseRef-USIF-NonCommercial"
license-files = ["LICENSE"]
authors = [
    {name = "haidi@hfut.edu.cn", email = "haidi@hfut.edu.cn"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "numpy>=1.19.0",
    "pymatgen>=2022.0.0",
    "monty>=2022.0.0",
]

[project.optional-dependencies]
ase = [
    "ase>=3.22.0",
]
mp = [
    "monty>=2022.0.0",
    "mp-api>=0.35.0",
]
benchmark = [
    "numpy>=1.19.0",
]
dev = [
    "pytest>=6.0",
    "pytest-cov>=2.0",
    "flake8>=6.0.0",
    "isort>=5.12.0",
    "black>=23.0.0",
    "mypy>=1.8.0",
    "bandit>=1.7.0",
    "pip-audit>=2.7.0",
    "build>=1.0.0",
]
all = [
    "ase>=3.22.0",
    "monty>=2022.0.0",
    "mp-api>=0.35.0",
    "pytest>=6.0",
    "pytest-cov>=2.0",
    "flake8>=6.0.0",
    "isort>=5.12.0",
    "black>=23.0.0",
    "mypy>=1.8.0",
    "bandit>=1.7.0",
    "pip-audit>=2.7.0",
    "build>=1.0.0",
]

[tool.setuptools]
# Auto-discover packages (equivalent to find_packages() in setup.py)
packages = {find = {include = ["usif*"]}}

[tool.setuptools.dynamic]
version = {attr = "usif.version.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--strict-markers --strict-config"

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 100
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
skip_glob = ["build/*", "dist/*", "*.egg-info/*", "htmlcov/*", ".tox/*", ".venv/*", "venv/*"]
known_first_party = ["usif"]
known_third_party = ["numpy", "pymatgen", "pytest", "monty"]


[tool.black]
line-length = 100
target-version = ["py310"]

[tool.coverage.run]
branch = true
source = ["usif"]
omit = ["*/tests/*", "*/examples/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 70

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
no_implicit_optional = true
check_untyped_defs = false

[[tool.mypy.overrides]]
module = ["usif.interop.*"]
ignore_errors = true

[tool.bandit]
exclude_dirs = ["tests", "docs/archive"]
skips = ["B101"]
