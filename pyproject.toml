[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "usif"
version = "0.8.0"
description = "Universal Structure Interchange Format for crystals and molecules"
readme = "README.md"
requires-python = ">=3.10"
license = "LicenseRef-USIF-NonCommercial"
license-files = ["LICENSE"]
authors = [
    {name = "haidi@hfut.edu.cn", email = "haidi@hfut.edu.cn"}
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "numpy>=1.19.0",
    "spglib>=2.5.0",
    "tomli>=2.0.0; python_version < '3.11'",
    "typer>=0.12.0",
]

[project.scripts]
usif = "usif.cli:main"

[project.optional-dependencies]
# matsimpy is not published on PyPI; install it from its source checkout
# (pip install -e /path/to/matsimpy) before or instead of this extra.
matsimpy = [
    "matsimpy>=0.11.0",
]
pymatgen = [
    "pymatgen>=2022.0.0",
]
ase = [
    "ase>=3.22.0",
]
mp = [
    "monty>=2022.0.0",
    "mp-api>=0.35.0",
]
benchmark = [
    "numpy>=1.19.0",
]
dev = [
    "pytest>=6.0",
    "pytest-cov>=2.0",
    "flake8>=6.0.0",
    "isort>=5.12.0",
    "black>=23.0.0",
    "mypy>=1.8.0",
    "bandit>=1.7.0",
    "pip-audit>=2.7.0",
    "build>=1.0.0",
    "tomli>=2.0.0; python_version < '3.11'",
    "typer>=0.12.0",
]
all = [
    "pymatgen>=2022.0.0",
    "ase>=3.22.0",
    "monty>=2022.0.0",
    "mp-api>=0.35.0",
    "pytest>=6.0",
    "pytest-cov>=2.0",
    "flake8>=6.0.0",
    "isort>=5.12.0",
    "black>=23.0.0",
    "mypy>=1.8.0",
    "bandit>=1.7.0",
    "pip-audit>=2.7.0",
    "build>=1.0.0",
    "tomli>=2.0.0; python_version < '3.11'",
    "typer>=0.12.0",
]

[tool.setuptools]
# Auto-discover packages (equivalent to find_packages() in setup.py)
packages = {find = {include = ["usif*", "scripts*"]}}

[tool.usif.release]
date = "2026-11-15"
sequence = 17
record = "20261115.017"
id = "usif-20261115-017"


[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration", "tests/reliability", "tests/examples"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--strict-markers --strict-config"
markers = [
    "unit: fast tests with no optional external services",
    "integration: adapter/service tests that may need optional packages",
    "interop: pymatgen or ASE interoperability tests",
    "mp_data: tests that exercise bundled Materials Project fixture data",
    "network: tests that require live external network/API access",
    "slow: long-running tests or larger fixture sweeps",
    "large: larger container/index behavior tests",
    "performance: performance-sensitive checks that are not normal PR gates",
    "reliability: corruption, integrity, recovery, and concurrency tests",
    "examples: repository example smoke tests",
]

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 100
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
skip_glob = ["build/*", "dist/*", "*.egg-info/*", "htmlcov/*", ".tox/*", ".venv/*", "venv/*"]
known_first_party = ["usif"]
known_third_party = ["ase", "click", "matsimpy", "monty", "mp_api", "numpy", "pymatgen", "pytest", "spglib", "typer"]


[tool.black]
line-length = 100
target-version = ["py310"]

[tool.coverage.run]
branch = true
source = ["usif"]
omit = ["*/tests/*", "*/examples/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
no_implicit_optional = true
check_untyped_defs = false

# Interop adapters are type-checked in 6.4+. External-library imports are
# tolerated through ignore_missing_imports above, but USIF adapter code is no
# longer hidden behind ignore_errors.

[tool.bandit]
exclude_dirs = ["tests", "docs/archive", "build", "dist"]
skips = ["B101"]
