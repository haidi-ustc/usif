[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "usif"
# Version should match usif/version.py __version__
# This is used by build tools before package installation
version = "4.0"
description = "Universal Structure Interchange Format for crystals and molecules"
readme = "README.md"
requires-python = ">=3.8"
license = {file = "LICENSE"}
authors = [
    {name = "haidi@hfut.edu.cn", email = "haidi@hfut.edu.cn"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "numpy>=1.19.0",
    "pymatgen>=2022.0.0",
]

[project.optional-dependencies]
ase = [
    "ase>=3.22.0",
]
mp = [
    "monty>=2022.0.0",
    "mp-api>=0.35.0",
]
benchmark = [
    "numpy>=1.19.0",
]
dev = [
    "pytest>=6.0",
    "pytest-cov>=2.0",
    "flake8>=6.0.0",
    "isort>=5.12.0",
    "build>=1.0.0",
]
all = [
    "ase>=3.22.0",
    "monty>=2022.0.0",
    "mp-api>=0.35.0",
    "pytest>=6.0",
    "pytest-cov>=2.0",
    "flake8>=6.0.0",
    "isort>=5.12.0",
    "build>=1.0.0",
]

[tool.setuptools]
# Auto-discover packages (equivalent to find_packages() in setup.py)
packages = {find = {}}

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 100
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
skip_glob = ["build/*", "dist/*", "*.egg-info/*", "htmlcov/*", ".tox/*", ".venv/*", "venv/*"]
known_first_party = ["usif"]
known_third_party = ["numpy", "pymatgen", "pytest", "monty"]

